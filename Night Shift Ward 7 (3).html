<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Night Shift Ward 7</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: ward-sign header on top; left = reception window + conversation log; right = clipboard tabs (Ask / File / Guide). Single dark look by choice: after-hours hospital. */
:root{
  --night:#0e1522; --wall:#172335; --wall2:#223552; --line:#2f4563;
  --paper:#e7ecef; --ink:#141c27; --amber:#f2b72e; --alarm:#ef5350; --ok:#4fc08d;
  --mute:#93a5ba; --fg:#e9eff5;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'IBM Plex Sans Thai','IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--night);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:14px 40px;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.app{max-width:1100px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.02em;margin:0;text-wrap:balance;line-height:1.05}
p{margin:0}
.mono{font-family:var(--mono)}
.en{font-family:var(--body)}
.mute{color:var(--mute)}

/* sign bar */
.sign{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;background:var(--wall);border:2px solid var(--line);border-radius:4px;padding:8px 14px}
.sign .brand{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.sign .brand i{display:inline-block;width:22px;height:22px;background:var(--amber);position:relative;border-radius:2px}
.sign .brand i::before,.sign .brand i::after{content:"";position:absolute;background:var(--night)}
.sign .brand i::before{left:9px;top:4px;width:4px;height:14px}
.sign .brand i::after{left:4px;top:9px;width:14px;height:4px}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-family:var(--mono);font-size:.82rem;color:var(--mute)}
.stats b{color:var(--fg);font-weight:500}
.trust{display:inline-flex;gap:4px;vertical-align:middle}
.trust span{width:14px;height:14px;border-radius:2px;background:var(--ok)}
.trust span.off{background:transparent;border:2px solid var(--line)}

/* buttons */
.btn{background:var(--amber);color:var(--ink);border:0;border-radius:3px;padding:11px 20px;font-weight:600;font-size:1rem;letter-spacing:.01em;min-height:44px}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--line)}
.btn.ghost:hover{border-color:var(--mute)}
.btn.red{background:var(--alarm);color:#1b0b0b}
.btn.small{padding:6px 12px;min-height:34px;font-size:.88rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* title + briefing */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;padding-block:10px}
.hero h1{font-size:clamp(3rem,10vw,6.4rem);text-transform:uppercase;letter-spacing:.03em}
.hero h1 em{font-style:normal;color:var(--amber)}
.hero .sub{font-size:1.1rem;color:var(--mute);max-width:46ch;margin-top:12px}
.hero .win{aspect-ratio:4/5;max-height:440px;width:100%}
.panel{background:var(--wall);border:2px solid var(--line);border-radius:4px;padding:16px;min-width:0}
.panel h2{font-size:1.5rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.panel h3{font-size:1.15rem;text-transform:uppercase;letter-spacing:.08em;color:var(--amber);margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.how{display:grid;gap:10px;margin-top:20px}
.how div{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;font-size:.95rem}
.how b{font-family:var(--display);font-size:1.5rem;color:var(--amber);line-height:1}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.setting:last-child{border:0}
.tog{min-width:64px;padding:5px 12px;border-radius:99px;border:2px solid var(--line);background:transparent;font-family:var(--mono);font-size:.82rem}
.tog[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#06251a;font-weight:500}
.focus-ex{font-family:var(--mono);font-size:.9rem;background:var(--night);border-left:4px solid var(--amber);padding:8px 12px;margin-top:8px}
.pv{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pv span{background:var(--night);border:1px solid var(--line);padding:3px 10px;border-radius:99px;font-size:.88rem}
.pv span small{color:var(--mute);margin-left:6px}

/* case layout */
.case{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.left,.right{display:flex;flex-direction:column;gap:12px;min-width:0}
.win{position:relative;overflow:hidden;border:10px solid var(--wall2);border-radius:4px;background:linear-gradient(#0a101b,#1b2b43);height:300px;box-shadow:inset 0 0 40px #000a}
.win .light{position:absolute;inset:0;background:radial-gradient(ellipse at 50% -10%,#cfe6ff55,transparent 60%);animation:flick 5s infinite steps(1)}
.win svg{position:absolute;left:50%;bottom:-6px;height:96%;transform:translateX(-50%);animation:rise .6s ease-out}
.win .ledge{position:absolute;left:0;right:0;bottom:0;height:26px;background:var(--wall2);border-top:3px solid var(--line);font-family:var(--mono);font-size:.7rem;color:var(--mute);display:flex;align-items:center;justify-content:center;letter-spacing:.2em;z-index:2}
.win .blink{transform-origin:center;transform-box:fill-box;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes rise{from{transform:translate(-50%,40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes flick{0%,100%{opacity:1}47%{opacity:.55}48%{opacity:1}71%{opacity:.7}72%{opacity:1}}
.tag{position:absolute;left:8px;top:8px;z-index:3;background:var(--night);border:1px solid var(--line);font-family:var(--mono);font-size:.74rem;padding:3px 8px;border-radius:2px;color:var(--mute)}
.chief{background:var(--paper);color:var(--ink);padding:12px 14px;border-radius:3px;font-size:1.02rem}
.chief small{display:block;font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#52657a;margin-bottom:2px}
.log{display:flex;flex-direction:column;gap:10px;max-height:340px;min-height:120px;overflow-y:auto;padding:4px 2px 4px 0;scroll-behavior:smooth}
.msg{max-width:92%;padding:10px 13px;border-radius:3px;font-size:1.02rem;line-height:1.5}
.msg.doc{align-self:flex-end;background:var(--paper);color:var(--ink)}
.msg.pat{align-self:flex-start;background:var(--wall2);border:1px solid var(--line)}
.msg .who{display:block;font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin-bottom:2px}
.msg .play{margin-top:6px}
.hid{letter-spacing:.3em;color:var(--mute)}
.w{background:none;border:0;padding:0;margin:0;color:var(--amber);border-bottom:2px dotted var(--amber);font:inherit;line-height:inherit}
.w:hover{background:#f2b72e22}
.gloss{background:var(--night);border:2px solid var(--amber);border-radius:3px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;min-height:48px}
.gloss b{font-family:var(--display);font-size:1.35rem;letter-spacing:.04em}
.gloss .th{font-size:1.05rem}
.gloss.idle{border-color:var(--line);color:var(--mute);font-size:.9rem}

/* right panel */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line)}
.tabs button{flex:1;background:transparent;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;padding:10px 6px;font-family:var(--display);font-size:1.15rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--amber)}
.tabs small{display:block;font-family:var(--body);font-size:.7rem;letter-spacing:0;text-transform:none;font-weight:400}
.budget{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:.82rem;color:var(--mute)}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pips i{width:16px;height:8px;background:var(--amber);border-radius:1px}
.pips i.used{background:var(--line)}
.qs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q{text-align:left;background:var(--wall);border:2px solid var(--line);border-radius:3px;padding:9px 11px;min-height:64px;display:flex;flex-direction:column;gap:2px;font-size:.95rem;line-height:1.35}
.q small{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.q:hover:not(:disabled){border-color:var(--amber)}
.q:disabled{opacity:.45;cursor:default}
.q.done::after{content:"asked";font-family:var(--mono);font-size:.64rem;color:var(--ok);letter-spacing:.1em}
.q.hint{border-color:var(--amber);box-shadow:0 0 0 3px #f2b72e44}
.note{display:grid;grid-template-columns:20px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.note:last-child{border:0}
.dot{width:12px;height:12px;border-radius:50%;margin-top:6px;background:var(--line)}
.dot.pos{background:var(--alarm)}
.dot.neg{background:var(--ok)}
.note small{display:block;font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.fileinfo{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:.95rem;margin-bottom:10px}
.fileinfo dt{color:var(--mute);font-family:var(--mono);font-size:.78rem;padding-top:2px}
.fileinfo dd{margin:0}
.chart{background:var(--paper);color:var(--ink);padding:10px 12px;border-radius:3px;font-family:var(--mono);font-size:.85rem;display:grid;gap:6px;margin-bottom:12px}
.chart .w{color:#8a5a00;border-bottom-color:#8a5a00}
.empty{color:var(--mute);font-size:.92rem;padding:8px 0}
details.cond{border-bottom:1px solid var(--line);padding:8px 0}
details.cond summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline;list-style:none}
details.cond summary::-webkit-details-marker{display:none}
details.cond summary b{font-family:var(--display);font-size:1.25rem;letter-spacing:.04em;text-transform:uppercase}
details.cond summary span{color:var(--mute);font-size:.88rem}
details.cond ul{margin:8px 0 4px 18px;padding:0;font-size:.95rem}
details.cond p{font-size:.92rem;margin-top:4px}

/* sheets */
.sheet{position:fixed;inset:0;background:#05080fcc;z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet .box{background:var(--wall);border:2px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;width:100%;max-width:640px;max-height:92%;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet.mid{align-items:center;padding:16px}
.sheet.mid .box{border-bottom:2px solid var(--line);border-radius:6px}
.dx{display:grid;gap:8px;margin:12px 0}
.dx button{text-align:left;background:var(--night);border:2px solid var(--line);border-radius:3px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.dx button b{font-family:var(--display);font-size:1.2rem;letter-spacing:.05em;text-transform:uppercase}
.dx button span{color:var(--mute);font-size:.88rem}
.dx button[aria-pressed="true"]{border-color:var(--amber);background:#f2b72e18}
.dx button.fake b{color:var(--alarm)}
.verdict{font-family:var(--display);font-size:2.6rem;text-transform:uppercase;letter-spacing:.04em;line-height:1}
.verdict.ok{color:var(--ok)}
.verdict.bad{color:var(--alarm)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips span{padding:3px 10px;border-radius:99px;font-size:.86rem;border:1px solid var(--line);background:var(--night)}
.chips span.got{border-color:var(--ok)}
.chips span.miss{border-color:var(--alarm);color:#ffb4b2}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;padding:8px;background:var(--night);border:2px dashed var(--line);border-radius:3px;margin:10px 0}
.tile{background:var(--paper);color:var(--ink);border:0;border-radius:3px;padding:8px 12px;font-size:1.02rem;font-weight:500;min-height:40px}
.tile.sel{background:var(--amber)}
.quiz-opt{display:block;width:100%;text-align:left;background:var(--night);border:2px solid var(--line);border-radius:3px;padding:11px 14px;margin-top:8px;font-size:1.02rem}
.quiz-opt:hover:not(:disabled){border-color:var(--amber)}
.quiz-opt.right{border-color:var(--ok);background:#4fc08d22}
.quiz-opt.wrong{border-color:var(--alarm);background:#ef535022}
.bar{height:10px;background:var(--night);border-radius:99px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--amber)}
.big{font-family:var(--display);font-size:3.2rem;line-height:1;color:var(--amber)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--paper);color:var(--ink);padding:9px 16px;border-radius:3px;z-index:60;font-size:.92rem;max-width:90%}

.mo{display:none;margin-bottom:12px}
.mo .msg{max-width:100%;margin-bottom:8px}
@media (max-width:860px){
  .mo{display:block}
  .hero{grid-template-columns:1fr}
  .hero .win{aspect-ratio:auto;height:240px}
  .case{grid-template-columns:minmax(0,1fr)}
  .grid2,.grid3{grid-template-columns:1fr}
  .log{max-height:300px}
}
@media (max-width:420px){
  .qs{grid-template-columns:1fr}
  .win{height:250px}
}
@media (prefers-reduced-motion:reduce){
  .win .light,.win svg,.win .blink{animation:none}
  .log{scroll-behavior:auto}
}
</style>

// signs = question ids that give the key clues. guide = bullet list shown in the Field Guide.
var CONDS = {
 mdd:{ name:'Major Depression', th:'ซึมเศร้า',

  tone:function(f,d,type,v,delay,to){
    var c=this.ctx;if(!c)return;
    var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(delay||0);
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d+.05);
  },
  noise:function(d,v,freq,delay){
    var c=this.ctx;if(!c||!this.nbuf)return;
    var s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain(),t=c.currentTime+(delay||0);
    s.buffer=this.nbuf;f.type='bandpass';f.frequency.value=freq;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f);f.connect(g);g.connect(this.master);s.start(t);s.stop(t+d+.05);
  },
  play:function(name){
    if(!this.ctx||!S.settings.sfx)return;
    var i,arp;
    switch(name){
      case 'tap':this.tone(520,.06,'square',.07,0);break;
      case 'word':this.tone(880,.08,'sine',.16,0);break;
      case 'tile':this.tone(660,.06,'triangle',.16,0);break;
      case 'page':this.noise(.1,.14,2200,0);break;
      case 'ask':this.tone(330,.09,'triangle',.12,0);this.tone(495,.12,'triangle',.1,.08);break;
      case 'door':
        this.tone(180,.45,'sawtooth',.025,0,130);
        this.tone(110,.09,'sine',.22,.5,70);this.tone(110,.09,'sine',.22,.68,70);
        break;
      case 'ok':this.tone(523,.14,'triangle',.14,0);this.tone(659,.14,'triangle',.14,.12);this.tone(784,.32,'triangle',.14,.24);break;
      case 'bad':this.tone(160,.35,'sawtooth',.09,0,110);this.tone(150,.4,'sawtooth',.09,.18,100);break;
      case 'win':arp=[392,494,587,784];for(i=0;i<arp.length;i++)this.tone(arp[i],.28,'triangle',.13,i*.13);break;
      case 'lose':arp=[330,262,196];for(i=0;i<arp.length;i++)this.tone(arp[i],.4,'sawtooth',.07,i*.22);break;
    }
  }

function tabGuide(){
  var out=CONSULT.map(function(k){var d=CONDS[k];return guideItem(d);}).join('')+guideItem(FAKE);
  return '<p class="mute" style="font-size:.88rem;margin-bottom:6px">Tap a name to open it.'+(S.settings.thai?' แตะชื่อเพื่อดูรายละเอียด':'')+'</p>'+out;
}
function guideItem(d){
  return '<details class="cond"><summary><b>'+d.name+'</b><span>'+d.th+'</span></summary><p>'+d.desc+'</p><ul>'+d.guide.map(function(g){return '<li>'+g+'</li>';}).join('')+'</ul><p class="mute">'+d.descTh+'</p></details>';
}
function vCase(){
  var cs=S.cs,c=cs.c,N=NIGHTS[S.night];
  collect(c.chief);
  var log=cs.log.map(msgHtml).join('');
  var tabs=[['ask','Ask','ถามคำถาม'],['file','File','แฟ้มคนไข้'],['guide','Guide','คู่มือโรค']].map(function(t){
    return '<button role="tab" aria-selected="'+(cs.tab===t[0])+'" data-act="tab" data-t="'+t[0]+'">'+t[1]+(S.settings.thai?'<small>'+t[2]+'</small>':'')+'</button>';}).join('');
  var body=cs.tab==='ask'?tabAsk():(cs.tab==='file'?tabFile():tabGuide());
  return header(true)+
  '<div class="case"><div class="left"><div class="win"><span class="tag">PATIENT '+(S.caseIdx+1)+'/'+S.caseList.length+' &middot; '+esc(c.name)+', '+c.age+'</span><div class="light"></div>'+portrait(c.look)+'<div class="ledge">RECEPTION &middot; ห้องตรวจ</div></div>'+
  '<div class="chief"><small>Chief complaint'+(S.settings.thai?' &middot; อาการที่มา':'')+'</small>'+vocab(c.chief)+(HAS_TTS?' <button class="btn ghost small" style="color:var(--ink);border-color:#8a9aaa;margin-left:6px" data-act="playchief">Play</button>':'')+'</div>'+
  glossHtml()+'<div class="log" id="log" aria-live="polite">'+log+'</div></div>'+
  '<div class="right panel"><div class="tabs" role="tablist">'+tabs+'</div><div>'+body+'</div></div></div>';
}
function sheetHtml(){
  var cs=S.cs;
  if(S.sheet==='dx'){
    var items=CONSULT.map(function(k){return '<button data-act="pick" data-k="'+k+'" aria-pressed="'+(cs.pick===k)+'"><b>'+CONDS[k].name+'</b><span>'+CONDS[k].th+'</span></button>';}).join('')+
      '<button class="fake" data-act="pick" data-k="fake" aria-pressed="'+(cs.pick==='fake')+'"><b>'+FAKE.name+'</b><span>'+FAKE.th+'</span></button>';
    return '<div class="sheet" data-act="closeSheet"><div class="box" role="dialog" aria-label="Diagnosis"><h2 style="font-size:1.8rem">Your diagnosis'+(S.settings.thai?' &middot; วินิจฉัย':'')+'</h2><p class="mute">Choose one for '+esc(cs.c.name)+'.</p><div class="dx">'+items+'</div><div class="row"><button class="btn" data-act="confirmDx"'+(cs.pick?'':' disabled')+'>ยืนยัน &middot; Confirm</button><button class="btn ghost" data-act="closeSheet">ยกเลิก &middot; Cancel</button></div></div></div>';
  }
  if(S.sheet==='puz'){
    var p=S.puz,q=qById(p.q);
    var sel=p.sel.map(function(ix){return '<button class="tile sel" data-act="untile" data-ix="'+ix+'">'+esc(p.words[ix])+'</button>';}).join('');
    var pool=p.words.map(function(w,ix){return p.sel.indexOf(ix)>=0?'':'<button class="tile" data-act="tile" data-ix="'+ix+'">'+esc(w)+'</button>';}).join('');
    return '<div class="sheet" data-act="closeSheet"><div class="box" role="dialog" aria-label="Build the question"><h2 style="font-size:1.8rem">Build the question'+(S.settings.thai?' &middot; เรียงประโยค':'')+'</h2><p class="mute">'+QTH[q.id]+'</p>'+
      '<div class="tiles" aria-label="Your sentence">'+(sel||'<span class="mute">Tap the words in order.</span>')+'</div><div class="tiles" style="border-style:solid">'+pool+'</div>'+
      '<div class="row"><button class="btn" data-act="checkPuz"'+(p.sel.length===p.words.length?'':' disabled')+'>ถาม &middot; Ask</button><button class="btn ghost small" data-act="clearPuz">ล้าง &middot; Clear</button>'+(p.err>=2?'<button class="btn ghost small" data-act="solvePuz">แสดงคำตอบ &middot; Show answer</button>':'')+'<button class="btn ghost small" data-act="closeSheet">ยกเลิก &middot; Cancel</button></div></div></div>';
  }
  if(S.sheet==='result'){
    var r=cs.result;
    return '<div class="sheet mid"><div class="box" role="dialog" aria-label="Result">'+r.html+'<div class="row" style="margin-top:14px"><button class="btn" data-act="next">'+r.nextLabel+'</button></div></div></div>';
  }
  return '';
}
function vReport(){
  var N=NIGHTS[S.night],ws=Object.keys(S.nightWords).map(function(k){return '<span>'+k+'<small>'+S.bankAll[k]+'</small></span>';}).join('');
  return header(true)+'<div class="panel"><div class="mono mute" style="font-size:.8rem;letter-spacing:.14em">NIGHT '+N.n+' REPORT</div><h2 style="font-size:2.4rem;margin:4px 0 10px">'+N.title+'</h2>'+
   '<div class="grid3"><div><div class="big">'+S.solved+'/'+S.caseList.length+'</div><div class="mute">cases solved'+(S.settings.thai?' &middot; วินิจฉัยถูก':'')+'</div></div><div><div class="big">'+S.score+'</div><div class="mute">score'+(S.settings.thai?' &middot; คะแนนรวม':'')+'</div></div><div><div class="big">'+Object.keys(S.nightWords).length+'</div><div class="mute">words met tonight'+(S.settings.thai?' &middot; คำศัพท์คืนนี้':'')+'</div></div></div></div>'+
   '<div class="panel"><h3>Words from tonight'+(S.settings.thai?' &middot; คำศัพท์ที่เจอ':'')+'</h3><div class="pv">'+ws+'</div></div>'+
   '<div class="row"><button class="btn" data-act="quiz">ทดสอบคำศัพท์ &middot; Vocabulary check</button></div>';
}
function vQuiz(){
  var q=S.quiz,cur=q.qs[q.i];
  var opts=cur.opts.map(function(o,ix){
    var cls='quiz-opt';
    if(q.picked!==null){if(o===cur.th)cls+=' right';else if(ix===q.picked)cls+=' wrong';}
    return '<button class="'+cls+'" data-act="qopt" data-ix="'+ix+'"'+(q.picked!==null?' disabled':'')+'>'+esc(o)+'</button>';}).join('');
  return header(true)+'<div class="panel"><div class="mono mute" style="font-size:.8rem;letter-spacing:.14em">VOCABULARY CHECK '+(q.i+1)+'/'+q.qs.length+'</div>'+
   '<div class="bar"><i style="width:'+((q.i+(q.picked!==null?1:0))/q.qs.length*100)+'%"></i></div>'+
   '<h2 style="font-size:2.6rem;margin:10px 0 4px;text-transform:none">'+esc(cur.w)+'</h2><div class="row"><button class="btn ghost small" data-act="hearword" data-w="'+esc(cur.w)+'">Hear</button><span class="mute">'+(S.settings.thai?'คำนี้แปลว่าอะไร? &middot; ':'')+'What does it mean?</span></div>'+opts+
   (q.picked!==null?'<div class="row" style="margin-top:14px"><span>'+(cur.opts[q.picked]===cur.th?'Correct! +20':'The answer is: '+esc(cur.th))+'</span><button class="btn" data-act="qnext">'+(q.i+1<q.qs.length?'ข้อต่อไป &middot; Next':'เสร็จสิ้น &middot; Finish')+'</button></div>':'')+'</div>';
}
function rank(){return S.score>=2000?'Chief Resident':(S.score>=1500?'Senior Resident':(S.score>=900?'Resident':'Intern'));}
function vFinal(){
  var ws=Object.keys(S.bankAll).map(function(k){return '<span>'+k+'<small>'+S.bankAll[k]+'</small></span>';}).join('');
  return header(false)+'<div class="panel"><div class="mono mute" style="font-size:.8rem;letter-spacing:.14em">SHIFT COMPLETE</div><h1 style="font-size:clamp(2.6rem,9vw,5rem);margin:6px 0">'+rank()+'</h1>'+
   '<div class="grid3" style="margin-top:12px"><div><div class="big">'+S.score+'</div><div class="mute">final score'+(S.settings.thai?' &middot; คะแนน':'')+'</div></div><div><div class="big">'+S.hearts+'/4</div><div class="mute">trust left'+(S.settings.thai?' &middot; Trust ที่เหลือ':'')+'</div></div><div><div class="big">'+Object.keys(S.bankAll).length+'</div><div class="mute">words learned'+(S.settings.thai?' &middot; คำศัพท์ที่ได้':'')+'</div></div></div></div>'+
   '<div class="panel"><h3>Your word bank'+(S.settings.thai?' &middot; คลังคำศัพท์':'')+'</h3><div class="pv">'+ws+'</div></div><div class="row"><button class="btn" data-act="restart">เล่นอีกครั้ง &middot; Play again</button></div>';
}
function vOver(){
  return header(true)+'<div class="panel"><h1 style="font-size:clamp(2.6rem,9vw,5rem);color:var(--alarm)">Trust lost</h1><p style="margin:10px 0;max-width:52ch">The ward doctor took you off the night shift. Too many wrong calls.'+(S.settings.thai?'<br><span class="mute">ตัดสินผิดหลายครั้ง คุณถูกพักเวรคืนนี้</span>':'')+'</p><div class="row"><button class="btn" data-act="retry">ลองคืนนี้ใหม่ &middot; Retry this night</button><button class="btn ghost" data-act="restart">กลับหน้าแรก &middot; Title</button></div></div>';
}
var $app=document.getElementById('app');
var lastScreen='';

function render(){
  var h='';
  switch(S.screen){
    case 'title':h=vTitle();break;
    case 'brief':h=vBrief();break;
    case 'case':h=vCase()+sheetHtml();break;
    case 'report':h=vReport();break;
    case 'quiz':h=vQuiz();break;
    case 'final':h=vFinal();break;
    case 'over':h=vOver();break;
  }
  $app.innerHTML=h;
  var log=document.getElementById('log');
  if(log)log.scrollTop=log.scrollHeight;
  if(lastScreen!==S.screen){window.scrollTo(0,0);lastScreen=S.screen;}
}
function setupNight(){
  S.caseList=CASES.filter(function(c){return c.night===S.night+1;});
  S.caseIdx=0;S.solved=0;S.nightWords={};S.nightStartScore=S.score;S.nightStartHearts=S.hearts;
}
function resetGame(){
  S.night=0;S.hearts=4;S.score=0;S.dict={};S.bankAll={};S.gloss=null;S.sheet=null;S.cs=null;
  setupNight();
}
function loadCase(){
  var c=S.caseList[S.caseIdx];
  S.cs={c:c,asked:[],log:[],notes:[],tab:'ask',hint:null,hintCost:0,shown:{},pick:null,result:null};
  S.gloss=null;S.sheet=null;S.screen='case';
  collect(c.chief);
  render();
  AU.play('door');
  if(S.settings.voice&&!S.settings.listen)speak(c.chief);
}
function doAsk(qid){
  var cs=S.cs,q=qById(qid),a=answer(cs.c,qid);
  if(cs.asked.indexOf(qid)>=0)return;
  cs.asked.push(qid);
  cs.log.push({who:'doc',t:q.t});
  cs.log.push({who:'pat',t:a.t});
  collect(a.t);
  cs.notes.push({cat:q.cat,n:a.n,pos:a.pos});
  if(cs.hint===qid)cs.hint=null;
  S.sheet=null;
  render();
  AU.play('ask');
  if(S.settings.voice||S.settings.listen)speak(a.t);
}
function openPuzzle(qid){
  var q=qById(qid),words=q.t.split(' '),idx=words.map(function(w,i){return i;}),order,tries=0;
  do{order=shuffle(idx);tries++;}while(tries<20&&order.every(function(v,i){return v===i;}));
  S.puz={q:qid,words:order.map(function(i){return words[i];}),sel:[],err:0};
  S.sheet='puz';render();
}
function resolve(){
  var cs=S.cs,c=cs.c,N=NIGHTS[S.night],t=truth(c),ok=cs.pick===t,left=N.budget-cs.asked.length,pts=0,h='',i;
  var last=S.caseIdx+1>=S.caseList.length;
  if(ok){pts=Math.max(30,100+left*10-cs.hintCost);S.score+=pts;S.solved++;}else{S.hearts--;}
  var d=t==='fake'?FAKE:CONDS[t];
  h+='<div class="verdict '+(ok?'ok':'bad')+'">'+(ok?'Correct':'Wrong call')+'</div>';
  h+='<p style="margin-top:10px"><b>'+esc(c.name)+'</b> '+(t==='fake'?'was faking an illness':'has '+d.name)+(S.settings.thai?' <span class="mute">('+d.th+')</span>':'')+'.</p>';
  h+='<p style="margin-top:6px">'+d.desc+'</p>'+(S.settings.thai?'<p class="mute" style="margin-top:4px">'+d.descTh+'</p>':'');
  if(t==='fake'){
    h+='<p style="margin-top:12px">They claimed <b>'+CONDS[c.cond].name+'</b>. The chart did not match the story:</p><div class="chart" style="margin-top:6px">'+c.chart.map(function(l){return '<div>'+esc(plain(l))+'</div>';}).join('')+'</div>';
  }else{
    h+='<p style="margin-top:12px">Key signs'+(S.settings.thai?' <span class="mute">(สัญญาณสำคัญ)</span>':'')+':</p><div class="chips">';
    CONDS[t].signs.forEach(function(qid){
      var q=qById(qid),a=answer(c,qid),asked=cs.asked.indexOf(qid)>=0;
      h+=(asked&&a.own)?'<span class="got">'+q.cat+': '+esc(a.n)+'</span>':'<span class="miss">Not found: '+q.cat+'</span>';
    });
    h+='</div>';
  }
  h+='<p style="margin-top:8px" class="mono">'+(ok?'+'+pts+' points'+(left>0?' &middot; '+left+' questions saved':''):'Trust &minus;1')+'</p>';
  var nl=S.hearts<=0?'ต่อไป &middot; Continue':(last?'รายงานเวร &middot; Night report':'คนไข้คนต่อไป &middot; Next patient');
  cs.result={html:h,nextLabel:nl};
  S.sheet='result';render();
  AU.play(ok?'ok':'bad');
}
function buildQuiz(){
  var keys=shuffle(Object.keys(S.nightWords)).slice(0,5);
  var all=[],k;for(k in S.bankAll)if(all.indexOf(S.bankAll[k])<0)all.push(S.bankAll[k]);
  S.quiz={i:0,picked:null,correct:0,qs:keys.map(function(w){
    var t=S.bankAll[w],others=shuffle(all.filter(function(x){return x!==t;})).slice(0,2);
    return {w:w,th:t,opts:shuffle([t].concat(others))};
  })};
  S.screen='quiz';render();
}

$app.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el)return;
  var act=el.getAttribute('data-act'),d=el.dataset,cs=S.cs;
  if(act==='closeSheet'&&e.target!==el)return;
  AU.unlock();
  if(SND[act])AU.play(SND[act]);
  switch(act){
    case 'mute':
      var on=!!(S.settings.sfx||S.settings.amb);
      S.settings.sfx=!on;S.settings.amb=!on;
      saveSettings();AU.syncAmb();render();break;
    case 'start':resetGame();S.screen='brief';render();break;
    case 'begin':S.caseIdx=0;loadCase();break;
    case 'set':
      S.settings[d.k]=!S.settings[d.k];
      if(d.k==='listen'&&S.settings.listen)S.settings.voice=true;
      saveSettings();AU.syncAmb();render();break;
    case 'puz':
      S.settings.puzzle={auto:'on',on:'off',off:'auto'}[S.settings.puzzle];
      saveSettings();render();break;
    case 'tab':cs.tab=d.t;render();break;
    case 'ask':
      if(puzzleOn())openPuzzle(d.q);else doAsk(d.q);
      break;
    case 'hint':
      var h=unaskedSign();
      if(h){cs.hint=h;cs.hintCost+=15;cs.tab='ask';render();toast('Try the highlighted question (−15 points)');}
      break;
    case 'word':
      var th=S.dict[d.w];
      S.gloss={w:d.w,th:th||''};
      Array.prototype.forEach.call(document.querySelectorAll('.glossbox'),function(g){g.classList.remove('idle');g.innerHTML=glossInner();});
      if(S.settings.voice)speak(d.w);
      break;
    case 'hearword':speak(d.w);break;
    case 'play':speak(cs.log[+d.i].t);break;
    case 'playchief':speak(cs.c.chief);break;
    case 'show':cs.shown[+d.i]=true;render();break;
    case 'dx':cs.pick=null;S.sheet='dx';render();break;
    case 'pick':cs.pick=d.k;render();break;
    case 'closeSheet':if(S.sheet==='dx'||S.sheet==='puz'){S.sheet=null;render();}break;
    case 'confirmDx':if(cs.pick)resolve();break;
    case 'tile':if(S.puz.sel.indexOf(+d.ix)<0){S.puz.sel.push(+d.ix);render();}break;
    case 'untile':S.puz.sel=S.puz.sel.filter(function(v){return v!==+d.ix;});render();break;
    case 'clearPuz':S.puz.sel=[];render();break;
    case 'checkPuz':
      var p=S.puz,q=qById(p.q),txt=p.sel.map(function(ix){return p.words[ix];}).join(' ');
      if(txt===q.t){doAsk(p.q);}
      else{p.err++;p.sel=[];render();AU.play('bad');toast('Not quite. Check the word order.');}
      break;
    case 'solvePuz':
      var pp=S.puz,qq=qById(pp.q).t.split(' '),used=[];
      pp.sel=qq.map(function(w){for(var i=0;i<pp.words.length;i++){if(pp.words[i]===w&&used.indexOf(i)<0){used.push(i);return i;}}return -1;});
      render();break;
    case 'next':
      S.sheet=null;
      if(S.hearts<=0){S.screen='over';render();AU.play('lose');}
      else if(S.caseIdx+1>=S.caseList.length){S.screen='report';render();AU.play('win');}
      else{S.caseIdx++;loadCase();}
      break;
    case 'quiz':buildQuiz();break;
    case 'qopt':
      if(S.quiz.picked===null){
        S.quiz.picked=+d.ix;
        if(S.quiz.qs[S.quiz.i].opts[S.quiz.picked]===S.quiz.qs[S.quiz.i].th){S.quiz.correct++;S.score+=20;AU.play('ok');}else AU.play('bad');
        render();
      }
      break;
    case 'qnext':
      if(S.quiz.i+1<S.quiz.qs.length){S.quiz.i++;S.quiz.picked=null;render();}
      else if(S.night+1>=NIGHTS.length){S.screen='final';render();AU.play('win');}
      else{
        S.night++;if(S.hearts<4)S.hearts++;
        setupNight();S.screen='brief';render();
        toast('Night over. You rested and gained 1 Trust.');
      }
      break;
    case 'retry':
      S.score=S.nightStartScore;S.hearts=Math.max(S.nightStartHearts,2);
      setupNight();S.screen='brief';render();break;
    case 'restart':resetGame();S.screen='title';render();break;
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&(S.sheet==='dx'||S.sheet==='puz')){S.sheet=null;render();}
});
loadSettings();
setupNight();
render();
</script>

</body></html>
